name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install --upgrade pip ruff

      - name: Content-rule lint (no em-dashes, etc.)
        run: python lint_content.py

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Verify package builds and installs
        run: pip install .

      - name: Smoke test console script
        working-directory: ${{ runner.temp }}
        run: |
          content-wiz --list
          content-wiz --platform whitepaper --topic "Package asset test" --url edstellar.com --dry-run
          python -c "import config; assert config.BRANDS, 'Packaged brand config is missing'"
          mkdir -p content-wiz-workspace
          export CONTENT_WIZ_WORKSPACE="$PWD/content-wiz-workspace"
          printf 'Source material for the installed CLI.' > "$CONTENT_WIZ_WORKSPACE/source.md"
          content-wiz --platform twitter --topic "Workspace test" --repurpose source.md --log-publish
          python -c "import os; from pathlib import Path; p = Path(os.environ['CONTENT_WIZ_WORKSPACE']); assert list((p / 'output').rglob('*.*')); assert list((p / 'data').glob('publish_tracker_*.csv'))"

      - name: Install LLM provider extras
        run: pip install .[llm]

      - name: Verify provider SDKs import (catches EOL/breaking SDK changes)
        run: python -c "import anthropic, google.genai, openai"
